<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>客户管理系统</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --ink:#17203a; --sub:#6b7793;
    --line:#e6eaf3; --brand:#3b6ef6; --brand2:#7a5cf0; --ok:#16a34a;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Microsoft YaHei",-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
  header{height:64px;display:flex;align-items:center;gap:14px;padding:0 28px;background:linear-gradient(90deg,#fff,#fbfcff);border-bottom:1px solid var(--line)}
  .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;color:#fff;font-weight:700}
  header h1{font-size:17px;margin:0;font-weight:700}
  nav{margin-left:26px;display:flex;gap:6px}
  nav a{padding:8px 14px;border-radius:9px;color:var(--sub);text-decoration:none;font-size:14px}
  nav a.active{background:#eef2ff;color:var(--brand);font-weight:600}
  .who{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--sub);font-size:13px}
  .avatar{width:30px;height:30px;border-radius:50%;background:#e9edf7;display:grid;place-items:center;color:#526089;font-weight:700}
  main{padding:26px 28px;max-width:1180px;margin:0 auto}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 30px rgba(23,32,58,.05)}
  .toolbar{display:flex;gap:14px;align-items:flex-end;padding:20px 22px}
  .field{display:flex;flex-direction:column;gap:7px}
  .field label{font-size:12px;color:var(--sub)}
  input,select{height:40px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:14px;background:#fbfcfe;color:var(--ink);outline:none;min-width:170px}
  input:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(59,110,246,.14);background:#fff}
  .btn{height:40px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:14px;cursor:pointer;font-weight:600}
  .btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));border:none;color:#fff}
  .btn.ghost{color:var(--sub)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  thead th{text-align:left;padding:14px 22px;color:var(--sub);font-weight:600;font-size:12px;border-bottom:1px solid var(--line);background:#fafbff}
  tbody td{padding:15px 22px;border-bottom:1px solid var(--line)}
  tbody tr:last-child td{border-bottom:none}
  .name{font-weight:600}
  .tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
  .tag.on{background:#e8f7ee;color:#128a43}
  .tag.off{background:#fdecec;color:#c0392b}
  .tag.wait{background:#fff4e5;color:#b26a00}
  .link{color:var(--brand);cursor:pointer;font-weight:600;background:none;border:none;font-size:14px;padding:0}
  .empty{padding:40px;text-align:center;color:var(--sub)}
  /* modal */
  .mask{position:fixed;inset:0;background:rgba(16,22,40,.42);display:none;align-items:center;justify-content:center;z-index:50}
  .mask.show{display:flex}
  .modal{width:460px;background:#fff;border-radius:16px;box-shadow:0 30px 60px rgba(16,22,40,.28);overflow:hidden}
  .modal h3{margin:0;padding:18px 22px;border-bottom:1px solid var(--line);font-size:16px}
  .modal .body{padding:20px 22px;display:grid;gap:14px}
  .modal .body .field{width:100%}
  .modal .body input,.modal .body select{width:100%}
  .modal .foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;background:#fafbff}
  .toast{position:fixed;top:22px;left:50%;transform:translateX(-50%) translateY(-16px);background:#128a43;color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:.3s;z-index:60;box-shadow:0 14px 30px rgba(18,138,67,.35)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
  <header>
    <div class="logo">C</div>
    <h1>客户管理系统</h1>
    <nav>
      <a href="#" class="active">客户列表</a>
      <a href="#">数据看板</a>
      <a href="#">设置</a>
    </nav>
    <div class="who"><span>运营中心</span><div class="avatar">李</div></div>
  </header>

  <main>
    <div class="panel">
      <div class="toolbar">
        <div class="field">
          <label>客户姓名</label>
          <input id="kw" placeholder="请输入客户姓名" />
        </div>
        <div class="field">
          <label>客户状态</label>
          <select id="status">
            <option value="">全部状态</option>
            <option value="on">正常</option>
            <option value="wait">待审核</option>
            <option value="off">已停用</option>
          </select>
        </div>
        <button class="btn primary" id="search">查询</button>
        <button class="btn ghost" id="reset">重置</button>
      </div>
      <table>
        <thead>
          <tr><th>客户</th><th>手机号</th><th>状态</th><th>最近跟进</th><th style="width:120px">操作</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty" style="display:none">没有符合条件的客户</div>
    </div>
  </main>

  <div class="mask" id="mask">
    <div class="modal">
      <h3>编辑客户信息</h3>
      <div class="body">
        <div class="field"><label>客户姓名</label><input id="m-name" /></div>
        <div class="field"><label>手机号</label><input id="m-phone" /></div>
        <div class="field"><label>客户状态</label>
          <select id="m-status">
            <option value="on">正常</option>
            <option value="wait">待审核</option>
            <option value="off">已停用</option>
          </select>
        </div>
      </div>
      <div class="foot">
        <button class="btn ghost" id="m-cancel">取消</button>
        <button class="btn primary" id="m-save">保存</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">保存成功</div>

<script>
  const DATA = [
    { name:'张三', phone:'138****2201', status:'on',   follow:'2026-09-18' },
    { name:'李小美', phone:'139****8820', status:'wait', follow:'2026-09-17' },
    { name:'王强', phone:'137****4512', status:'on',   follow:'2026-09-15' },
    { name:'赵敏', phone:'135****3390', status:'off',  follow:'2026-09-12' },
    { name:'陈晨', phone:'136****7745', status:'on',   follow:'2026-09-10' },
  ];
  const TAG = { on:['on','正常'], wait:['wait','待审核'], off:['off','已停用'] };
  const rows = document.getElementById('rows');
  const empty = document.getElementById('empty');
  let editing = null;

  function render(list){
    rows.innerHTML = '';
    empty.style.display = list.length ? 'none' : 'block';
    list.forEach((c, i) => {
      const [cls, label] = TAG[c.status];
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="name">${c.name}</td>
        <td>${c.phone}</td>
        <td><span class="tag ${cls}">${label}</span></td>
        <td>${c.follow}</td>
        <td><button class="link" data-name="${c.name}">编辑</button></td>`;
      rows.appendChild(tr);
    });
  }
  render(DATA);

  document.getElementById('search').addEventListener('click', () => {
    const kw = document.getElementById('kw').value.trim();
    const st = document.getElementById('status').value;
    const list = DATA.filter(c =>
      (!kw || c.name.includes(kw)) && (!st || c.status === st));
    render(list);
  });
  document.getElementById('reset').addEventListener('click', () => {
    document.getElementById('kw').value = '';
    document.getElementById('status').value = '';
    render(DATA);
  });

  rows.addEventListener('click', (e) => {
    const btn = e.target.closest('.link');
    if (!btn) return;
    const c = DATA.find(x => x.name === btn.dataset.name);
    editing = c;
    document.getElementById('m-name').value = c.name;
    document.getElementById('m-phone').value = c.phone;
    document.getElementById('m-status').value = c.status;
    document.getElementById('mask').classList.add('show');
  });
  document.getElementById('m-cancel').addEventListener('click', () =>
    document.getElementById('mask').classList.remove('show'));
  document.getElementById('m-save').addEventListener('click', () => {
    editing.name = document.getElementById('m-name').value;
    editing.phone = document.getElementById('m-phone').value;
    editing.status = document.getElementById('m-status').value;
    document.getElementById('mask').classList.remove('show');
    render(DATA);
    const t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1600);
  });
</script>
</body>
</html>
