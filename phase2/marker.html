<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>PHASE2-DEDICATED-CHROME</title>
<style>
  body{margin:0;height:100vh;display:grid;place-items:center;
       font-family:"Microsoft YaHei",-apple-system,"Segoe UI",sans-serif;
       background:#0f1526;color:#e7ecf7}
  .box{text-align:center}
  h1{font-size:30px;margin:0 0 10px;letter-spacing:.5px}
  p{margin:0;color:#8f9bbd;font-size:14px;line-height:1.7}
  code{color:#9ec1ff}
  #probe{margin-top:22px;padding:10px 18px;border-radius:10px;border:1px solid #2b3760;
         background:#171f38;color:#cdd7ef;font-size:14px;cursor:pointer}
  #probe.out{background:#123a24;border-color:#1d6b3f;color:#c8f3d8}
</style>
</head>
<body>
  <div class="box">
    <h1>PHASE2 — Dedicated Chrome</h1>
    <p>这个 Chrome 由 <code>phase2/launch-browser.js</code> 启动，profile 独立，调试端口仅绑定 localhost。</p>
    <p>若 Agent 通过 MCP 能看到本页，说明 Shared Browser 成立。</p>
    <button id="probe">点我（供 MCP smoke test 使用）</button>
  </div>
<script>
  document.getElementById('probe').addEventListener('click', (e) => {
    e.target.textContent = '已被点击 ✓';
    e.target.classList.add('out');
    window.__phase2Probe = 'clicked';
  });
</script>
</body>
</html>
